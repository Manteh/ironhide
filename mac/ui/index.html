<!doctype html>
<html><head><meta charset="utf-8"><title>Orbie</title>
<!--
  The start-up screen. A real-time render (WebGL) of the Orbie orb: a glass sphere with liquid light flowing inside it,
  an iridescent rim, a softbox reflection and a bloom of light around it.
    0.0 s   a point of light in the dark
    0.3 s   it blooms into the orb; the light inside swirls fast, then calms
    1.45 s  the orb releases a shockwave of light that sweeps the screen, and glides into the "o" of orbie
    1.8 s   the letters rise in behind the wave
    ready   (the app calls __ihReady) the camera dives into the orb, through the light, into the app
  If the service is slow the orb keeps breathing and a quiet status line fades in. Without WebGL a pre-rendered orb is used.
-->
<style>
  @font-face { font-family: 'Outfit'; src: url('fonts/Outfit.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  :root { --bg: #07070d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #f3f1ff; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default;
    font: 14px 'Outfit', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .drag { position: fixed; inset: 0 0 auto; height: 38px; z-index: 5; }
  main { position: relative; height: 100%; display: grid; place-items: center; }

  .lockup { position: relative; display: flex; align-items: baseline; font: 600 104px/1 'Outfit', -apple-system, sans-serif; letter-spacing: -.035em; }
  .slot { display: inline-block; width: .64em; height: .64em; margin: 0 .035em 0 0; }
  .slot img { width: 100%; height: 100%; display: none; }
  .nogl .slot img { display: block; }
  .rest span { display: inline-block; opacity: 0; background: linear-gradient(180deg, #ffffff 30%, #d9d2ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .status { position: fixed; bottom: 54px; left: 0; right: 0; display: grid; justify-items: center; gap: 12px; opacity: 0; transition: opacity .8s; }
  .slow .status { opacity: 1; }
  .status p { margin: 0; color: rgba(200, 196, 230, .55); font-size: 13px; letter-spacing: .01em; max-width: 440px; text-align: center; line-height: 1.5; }
  .hair { width: 110px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .07); overflow: hidden; }
  .hair i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #b9a8ff, transparent); animation: hair 1.5s cubic-bezier(.45, 0, .25, 1) infinite; }
  @keyframes hair { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .act { display: none; gap: 10px; margin-top: 4px; } .err .act { display: flex; } .err .hair { display: none; } .err .status { opacity: 1; } .err .status p { color: #ffa198; }
  button { border: 0; border-radius: 10px; padding: 8px 15px; font: 600 13px 'Outfit', -apple-system, sans-serif; cursor: pointer; background: #1f1d2b; color: #f3f1ff; }
  button.pri { background: #f3f1ff; color: #0c0b14; }
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="drag" data-tauri-drag-region></div>
<main id="m">
  <div class="lockup" id="lockup" aria-label="orbie"><span class="slot" id="slot"><img src="orb.png" alt=""></span><span class="rest" id="rest"></span></div>
  <div class="status"><div class="hair"><i></i></div><p id="s">Starting…</p>
    <div class="act"><button class="pri" id="retry">Try again</button><button id="log">Show log</button></div></div>
</main>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;      // canvas size (device px)
uniform float uT;       // seconds (of swirl)
uniform vec2 uC;        // orb centre (device px, GL coords)
uniform float uR;       // orb radius (device px)
uniform float uGlow;    // bloom strength
uniform float uFill;    // how much light is inside the orb
uniform float uRing;    // shockwave radius (device px)
uniform float uRingA;   // shockwave strength
uniform float uFade;    // 1 = visible, 0 = the app's background colour

float hash(vec3 p) { p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float hash2(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }

void main() {
  vec2 p = gl_FragCoord.xy;
  vec2 q = (p - uC) / uR;
  float d = length(q);
  float dpx = length(p - uC);

  // the room: near-black with a violet haze around the orb, and a little dust in the light
  vec3 bg = vec3(0.027, 0.027, 0.05);
  float out1 = max(d - 1.0, 0.0);
  bg += vec3(0.42, 0.28, 1.0) * exp(-out1 * 2.4) * 0.32 * uGlow;
  bg += vec3(0.75, 0.2, 0.65) * exp(-out1 * 0.7) * 0.07 * uGlow;
  bg += vec3(0.25, 0.2, 0.6) * exp(-dpx / (uRes.y * 0.55)) * 0.06;
  vec2 cell = floor(p / 3.0);
  float star = step(0.9975, hash2(cell)) * (0.5 + 0.5 * sin(uT * 2.0 + hash2(cell + 7.0) * 30.0));
  bg += star * 0.22 * exp(-dpx / (uRes.y * 0.5));

  // the shockwave: a thin ring of light that splits into colours as it travels
  float w = max(uR * 0.05, 3.0);
  float rr = exp(-pow((dpx - uRing * 1.012) / w, 2.0));
  float rg = exp(-pow((dpx - uRing) / w, 2.0));
  float rb = exp(-pow((dpx - uRing * 0.988) / w, 2.0));
  bg += vec3(rr * 0.9, rg * 0.75, rb * 1.25) * uRingA;
  bg += vec3(0.5, 0.4, 1.0) * exp(-pow((dpx - uRing * 0.93) / (w * 5.0), 2.0)) * uRingA * 0.18;

  vec3 col = bg;
  if (d < 1.0) {
    float z = sqrt(1.0 - d * d);
    vec3 n = vec3(q, z);

    // liquid light inside: domain-warped noise seen through curved glass (stronger bend near the edge)
    vec2 uv = q * (1.0 + 0.45 * (1.0 - z));
    float t = uT;
    vec3 pp = vec3(uv * 1.35, t * 0.11);
    float w1 = fbm(pp + vec3(0.0, 0.0, t * 0.05));
    float w2 = fbm(pp + vec3(5.2, 1.3, 2.0));
    float neb = fbm(pp + vec3(w1 * 1.7, w2 * 1.7, t * 0.07));
    vec3 inner = mix(vec3(0.035, 0.015, 0.16), vec3(0.42, 0.18, 0.95), smoothstep(0.30, 0.78, neb));
    inner = mix(inner, vec3(0.95, 0.25, 0.70), smoothstep(0.55, 0.85, w1) * 0.6);
    // ridges of the flow: thin, bright threads of light, the way light pools in liquid glass
    float ridge = 1.0 - abs(2.0 * fbm(pp * 0.75 + vec3(w2 * 1.3, w1 * 1.3, t * 0.06)) - 1.0);
    inner += vec3(0.50, 0.80, 1.0) * pow(ridge, 7.0) * 0.42;
    inner += vec3(1.0, 0.60, 0.95) * pow(ridge, 18.0) * 0.38;
    inner *= (0.32 + 0.85 * z) * (0.6 + 0.4 * smoothstep(1.0, 0.55, d));              // deeper in the middle, darker glass at the edge
    inner += vec3(0.8, 0.72, 1.0) * exp(-d * d * 4.0) * 0.16;                        // a soft core

    // the glass
    vec3 L = normalize(vec3(-0.5, 0.62, 0.62));
    vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(n, H), 0.0), 220.0) * 1.6;
    vec2 sb = (q - vec2(-0.36, 0.43));
    sb = mat2(0.87, -0.5, 0.5, 0.87) * sb / vec2(0.30, 0.13);
    float softbox = smoothstep(1.0, 0.25, length(sb)) * 0.42;                        // a window reflected in the glass
    float F = pow(1.0 - z, 2.6);
    // a thin-film sheen on the glass, kept to the brand's cyan and pink (no muddy rainbow)
    vec3 iri = mix(vec3(0.42, 0.86, 1.0), vec3(1.0, 0.42, 0.86), 0.5 + 0.5 * sin(F * 7.0 + q.y * 2.2 + uT * 0.25));
    vec3 shell = iri * F * 1.15 + vec3(0.55, 0.88, 1.0) * pow(1.0 - z, 7.0) * 0.9;
    shell += vec3(1.0, 0.32, 0.72) * pow(max(dot(n, normalize(vec3(0.35, -0.85, 0.3))), 0.0), 2.0) * 0.35;  // warm bounce from below
    float shade = 0.55 + 0.45 * max(dot(n, L), 0.0);

    vec3 orb = inner * uFill * shade + shell + spec + softbox;
    float aa = smoothstep(1.0, 1.0 - 1.5 / uR, d);
    col = mix(col, orb, aa);
  }

  col = 1.0 - exp(-col * 1.3);                       // filmic roll-off: bright stays bright without clipping
  col = mix(vec3(0.051, 0.051, 0.055), col, uFade);  // fade to the app's own background
  col += (hash2(p + fract(uT)) - 0.5) / 255.0;       // dither: no banding in the dark gradients
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const m = $('m'), cv = $('gl'), slot = $('slot'), rest = $('rest');
  [...'rbie'].forEach((ch) => { const s = document.createElement('span'); s.textContent = ch; rest.appendChild(s); });
  const letters = [...rest.children];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- WebGL ----
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  let prog = null; const U = {};
  if (gl) {
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (console.error(gl.getShaderInfoLog(s)), null); };
    const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }');
    const fs = sh(gl.FRAGMENT_SHADER, $('fs').textContent);
    if (vs && fs) {
      prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) prog = null;
    }
    if (prog) {
      gl.useProgram(prog);
      const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      for (const k of ['uRes', 'uT', 'uC', 'uR', 'uGlow', 'uFill', 'uRing', 'uRingA', 'uFade']) U[k] = gl.getUniformLocation(prog, k);
    }
  }
  if (!prog) document.documentElement.classList.add('nogl');

  let dpr = 1, W = 0, H = 0;
  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (gl) gl.viewport(0, 0, cv.width, cv.height);
  };

  // ---- timeline ----
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inCubic = (x) => x * x * x;
  const lerp = (a, b, x) => a + (b - a) * x;
  const INTRO = 2500;
  const FREEZE = (() => { const v = new URLSearchParams(location.search).get('t'); return v == null ? null : Number(v); })(); // ?t=1.6 holds the intro at that second (for checking frames)

  let begun = 0, dive = 0, swirlT = 3, lastNow = 0, lettersShown = false;
  function frame(now) {
    if (W !== innerWidth || H !== innerHeight) size();
    if (!W || !H) return requestAnimationFrame(frame);
    if (!begun) begun = now;
    const t = (window.__freeze ?? FREEZE) != null ? (window.__freeze ?? FREEZE) : reduce ? 9 : (now - begun) / 1000;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0; lastNow = now;

    // where the orb ends up: the "o" of the word
    const r = slot.getBoundingClientRect();
    const fx = r.left + r.width / 2, fy = r.top + r.height / 2, fr = r.width / 2;
    const r0 = Math.min(W, H) * 0.21; // big, in the middle

    const bloom = outExpo(span(t, 0.28, 1.25));
    const glide = inOut(span(t, 1.42, 2.12));
    let R = lerp(lerp(2.2, r0, bloom), fr, glide);
    const cx = lerp(W / 2, fx, glide), cy = lerp(H / 2, fy, glide);
    swirlT = (window.__freeze ?? FREEZE) != null ? 3 + (window.__freeze ?? FREEZE) * 1.4 : swirlT + dt * lerp(3.2, 0.55, span(t, 0.6, 2.2)); // the light inside: fast while it forms, calm after
    let glow = lerp(0, 1.5, span(t, 0, 0.35)) - 0.55 * span(t, 0.6, 1.4);
    glow += 0.1 * Math.sin(now / 900) * span(t, 2.4, 3.2); // breathing while it waits
    const fill = lerp(0.35, 1, span(t, 0.2, 1));
    const wave = span(t, 1.42, 2.3);
    const ring = lerp(r0, Math.hypot(W, H) * 0.95, outCubic(wave));
    let ringA = wave > 0 && wave < 1 ? Math.sin(Math.PI * Math.min(1, wave * 1.15)) * (1 - wave) * 1.6 : 0;
    let fade = 1;

    if (dive) { // into the orb, through the light, out into the app
      const k = clamp((now - dive) / 900), e = inCubic(k);
      R = lerp(fr, Math.hypot(W, H) * 1.6, e);
      ringA = 0; glow = lerp(glow, 2, e);
      fade = 1 - span(k, 0.72, 1);
    }
    if (!lettersShown && t > 1.72) { lettersShown = true; if ((window.__freeze ?? FREEZE) != null) letters.forEach((l, i) => { const k = clamp((t - 1.72 - i * 0.085) / 0.5); l.style.opacity = k; l.style.transform = `translateY(${(1 - k) * 0.18}em)`; }); else showLetters(); }

    if (prog) {
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uT, swirlT);
      gl.uniform2f(U.uC, cx * dpr, (H - cy) * dpr);
      gl.uniform1f(U.uR, Math.max(R, 0.5) * dpr);
      gl.uniform1f(U.uGlow, Math.max(glow, 0));
      gl.uniform1f(U.uFill, fill);
      gl.uniform1f(U.uRing, ring * dpr);
      gl.uniform1f(U.uRingA, ringA);
      gl.uniform1f(U.uFade, fade);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    if (!(dive && now - dive > 950)) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__frame = frame; // for checking frames: __freeze = 1.6; __frame(performance.now())

  function showLetters() {
    letters.forEach((l, i) => l.animate([
      { opacity: 0, transform: 'translateY(.18em) scale(.97)' },
      { opacity: 1, transform: 'none' },
    ], { duration: 700, delay: i * 85, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'both' }));
  }
  if (reduce) { lettersShown = true; letters.forEach((l) => (l.style.opacity = 1)); }

  // ---- talking to the app ----
  const slow = setTimeout(() => m.classList.add('slow'), 3800);
  window.__ihStatus = (t) => { $('s').textContent = t; };
  window.__ihError = (t) => { clearTimeout(slow); m.classList.add('err', 'slow'); $('s').textContent = t; };
  let leaving = false;
  window.__ihReady = (url) => {
    if (leaving) return; leaving = true;
    const go = () => {
      const t = begun ? performance.now() - begun : 0;
      if (t < INTRO) return setTimeout(go, INTRO - t);
      clearTimeout(slow); m.classList.remove('slow');
      $('lockup').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards', easing: 'ease-in' });
      dive = performance.now();
      if (!prog) document.body.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' });
      setTimeout(() => location.replace(url), 940);
    };
    go();
  };
  const inv = (c) => window.__TAURI_INTERNALS__?.invoke(c);
  $('retry').onclick = () => { m.classList.remove('err', 'slow'); leaving = false; $('s').textContent = 'Starting…'; inv('retry_boot'); };
  $('log').onclick = () => inv('open_log');
</script></body></html>
