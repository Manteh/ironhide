[package]
name = "ironhide-mac"
version = "0.1.0"
description = "IronHide for macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libmpv2 = "7.0.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSEvent", "NSOpenGL", "NSGraphics"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
