<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronHide</title>
  <script>
    // Apply cached appearance before first paint to avoid a theme flash.
    try {
      var a = JSON.parse(localStorage.getItem('ih-appearance') || 'null');
      if (a) {
        var r = document.documentElement, t = a.theme;
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        r.dataset.theme = t; r.dataset.accent = a.accent; r.dataset.density = a.density;
        r.dataset.radius = a.radius; r.dataset.motion = a.motion; r.dataset.poster = a.posterSize;
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="gate"></div>
  <div id="app"></div>
  <div id="remote" class="remote hidden">
    <button class="rb main" id="rPlay" aria-label="Play or pause"></button>
    <div class="r-info"><div class="r-title" id="rTitle"></div><div class="r-bar"><div id="rFill"></div></div></div>
    <span class="r-time" id="rTime"></span>
    <button class="rb" id="rBack" aria-label="Back 30 seconds"></button>
    <button class="rb" id="rFwd" aria-label="Forward 30 seconds"></button>
    <button class="rb" id="rStop" aria-label="Stop"></button>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
