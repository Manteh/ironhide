<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ironhide Browse</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="browse.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="browse">
  <div id="gate"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f8cff"/><stop offset="1" stop-color="#4b48d6"/></linearGradient></defs><path d="M16 2l11 4v9c0 7.2-4.6 12.4-11 15C9.6 27.4 5 22.2 5 15V6z" fill="url(#gg)"/><path d="M16 9l2.2 4.8L23 16l-4.8 2.2L16 23l-2.2-4.8L9 16l4.8-2.2z" fill="#fff" fill-opacity=".92"/></svg><div class="ok">Welcome back</div><div class="lock">Private access</div></div>
  <script>
    (function () {
      var g = document.getElementById('gate');
      if (sessionStorage.getItem('ih-in')) { g.remove(); return; }
      sessionStorage.setItem('ih-in', '1');
      setTimeout(function () { g.classList.add('out'); setTimeout(function () { g.remove(); }, 700); }, 1100);
    })();
  </script>

  <header class="app-header">
    <div class="header-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f8cff"/><stop offset="1" stop-color="#4b48d6"/></linearGradient></defs><path d="M16 2l11 4v9c0 7.2-4.6 12.4-11 15C9.6 27.4 5 22.2 5 15V6z" fill="url(#lg)"/><path d="M16 9l2.2 4.8L23 16l-4.8 2.2L16 23l-2.2-4.8L9 16l4.8-2.2z" fill="#fff" fill-opacity=".92"/></svg><span class="brand-name">IronHide</span><span class="brand-sub">Private</span></div>
    <nav class="header-nav"><a href="/browse.html" class="active">Browse</a><a href="/">Playlists</a></nav>
    <input id="q" class="search" type="search" placeholder="find something…" autocomplete="off" />
  </header>

  <main id="view" class="view"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel" id="modalPanel"></div>
  </div>

  <div id="remote" class="remote hidden">
    <button id="rPlay" title="Play/Pause">⏯</button>
    <div class="r-info"><div id="rTitle" class="r-title"></div><div class="r-bar"><div id="rFill"></div></div></div>
    <span id="rTime" class="r-time"></span>
    <button id="rBack" title="Back 30s">⏪</button>
    <button id="rFwd" title="Forward 30s">⏩</button>
    <button id="rStop" title="Stop">⏹</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="browse.js"></script>
</body>
</html>
